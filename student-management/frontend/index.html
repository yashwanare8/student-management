<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Information Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Student Information Management System</h1></header>
  <main>
    <section class="card">
      <h2 id="formTitle">Add Student</h2>
      <form id="studentForm">
        <input id="studentId" placeholder="Student ID (e.g. ST101)" required>
        <input id="name" placeholder="Name" required>
        <input id="email" type="email" placeholder="Email" required>
        <input id="department" placeholder="Department" required>
        <input id="semester" type="number" min="1" max="12" placeholder="Semester" required>
        <input id="contact" placeholder="Contact">
        <div>
          <button type="submit" id="saveBtn">Add Student</button>
          <button type="button" id="cancelBtn" class="secondary" hidden>Cancel</button>
        </div>
      </form>
      <p id="message"></p>
    </section>

    <section class="card">
      <h2>Student List</h2>
      <div class="search">
        <input id="search" placeholder="Search by ID, name or department">
        <button id="searchBtn">Search</button>
        <button id="resetBtn" class="secondary">Show All</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>ID</th><th>Name</th><th>Email</th><th>Dept</th><th>Sem</th><th>Contact</th><th>Actions</th></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
